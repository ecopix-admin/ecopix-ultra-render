<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Skaner & Laminat Təlimatı</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        /* İdarəetmə Paneli (İnterfeys) */
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 {
            color: #fff;
            margin: 0 0 5px 0;
            font-size: 18px;
            letter-spacing: 1px;
        }
        p {
            color: #ccc;
            font-size: 13px;
            margin: 0 0 15px 0;
            min-height: 36px;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #btn-action {
            background: #007aff;
            color: white;
        }
        #btn-action:active {
            background: #0056b3;
        }
        #btn-next {
            background: #34c759;
            color: white;
        }
        #btn-next:active {
            background: #248a3d;
        }
        /* Yuxarı status paneli */
        #status-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #34c759;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="status-bar">Kamera Aktivdir • Səth Skan Edilir</div>

    <div id="ui-container">
        <h2 id="step-title">Rejim: Skaner (Planşet)</h2>
        <p id="step-desc">Kameranı döşəməyə doğru tutun və küncləri qeyd etmək üçün "Nöqtə Əlavə Et" düyməsini sıxın.</p>
        
        <div class="btn-group">
            <button id="btn-action" onclick="addCornerPoint()">Nöqtə Əlavə Et</button>
            <button id="btn-next" onclick="nextStep()">Laminat Dərsinə Keç</button>
        </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-entity camera look-controls>
            <a-entity cursor="fuse: false;"
                      position="0 0 -1"
                      geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                      material="color: #007aff; shader: flat">
            </a-entity>
        </a-entity>

        <a-marker preset="hiro">
            
            <a-entity id="ar-world">
                <a-plane position="0 0 0" rotation="-90 0 0" width="4" height="4" color="#222" opacity="0.4"></a-plane>
            </a-entity>
            
        </a-marker>

    </a-scene>

    <script>
        let currentMode = "scan"; // scan və ya laminate
        let laminateStep = 0;
        const arWorld = document.getElementById('ar-world');
        const stepTitle = document.getElementById('step-title');
        const stepDesc = document.getElementById('step-desc');
        const btnAction = document.getElementById('btn-action');
        const btnNext = document.getElementById('btn-next');

        // Mərhələlərin mətnləri
        const laminatSteps = [
            { title: "Mərhələ 1: Şiltə (Podlozka)", desc: "Laminatdan əvvəl səthə səs və nəm izolyasiyası üçün xüsusi şiltəni bu şəkildə sərin." },
            { title: "Mərhələ 2: İlk Lövhə", desc: "İlk laminat lövhəsini divardan 10mm məsafə (paz) saxlayaraq küncə yerləşdirin." },
            { title: "Mərhələ 3: Klik Sistemi", desc: "Növbəti laminatı 45 dərəcə bucaq altında daxil edin və aşağı doğru basaraq kilidləyin." },
            { title: "Mərhələ 4: Tamamlanma", desc: "Son xətti divarın ölçüsünə uyğun kəsib oturdun. Təbrik edirəm, döşəmə hazırdır!" }
        ];

        // REJİMLƏR ARASI KEÇİD VƏ ADDIMLAR
        function nextStep() {
            if (currentMode === "scan") {
                // Skaner rejimindən Laminat təlimatına keçid
                currentMode = "laminate";
                btnAction.textContent = "Əvvəlki Addım";
                btnNext.textContent = "Növbəti Addım";
                clearWorld();
                renderLaminateStep();
            } else {
                // Laminat addımlarını irəli aparmaq
                if (laminateStep < laminatSteps.length - 1) {
                    laminateStep++;
                    renderLaminateStep();
                } else {
                    // Başa qayıt
                    currentMode = "scan";
                    laminateStep = 0;
                    btnAction.textContent = "Nöqtə Əlavə Et";
                    btnNext.textContent = "Laminat Dərsinə Keç";
                    stepTitle.textContent = "Rejim: Skaner (Planşet)";
                    stepDesc.textContent = "Kameranı döşəməyə doğru tutun və küncləri qeyd etmək üçün 'Nöqtə Əlavə Et' düyməsini sıxın.";
                    clearWorld();
                }
            }
        }

        function addCornerPoint() {
            if (currentMode === "scan") {
                // Təsadüfi koordinatlarla (və ya kursorun mərkəzinə yaxın) nöqtə qoymaq
                const x = (Math.random() - 0.5) * 2;
                const z = (Math.random() - 0.5) * 2;

                // Ağ rəngli professional künc markeri (Skaner effekti)
                const point = document.createElement('a-sphere');
                point.setAttribute('position', `${x} 0.05 ${z}`);
                point.setAttribute('radius', '0.08');
                point.setAttribute('color', '#ffffff');
                point.setAttribute('emissive', '#007aff');
                arWorld.appendChild(point);

                // Nöqtələri birləşdirən ağ xətlərin simulyasiyası
                stepDesc.textContent = `Künc nöqtəsi təyin edildi: X: ${x.toFixed(2)}, Z: ${z.toFixed(2)}. Plan qurulur...`;
            } else {
                // Laminat rejimində bu düymə "Geri" funksiyasını yerinə yetirir
                if (laminateStep > 0) {
                    laminateStep--;
                    renderLaminateStep();
                }
            }
        }

        // LAMINAT ANIMASIYALARINI VƏ MODELLƏRİNİ EKRANA GƏTİRƏN FUNKSİYA
        function renderLaminateStep() {
            clearWorld();
            const data = laminatSteps[laminateStep];
            stepTitle.textContent = data.title;
            stepDesc.textContent = data.desc;

            if (laminateStep === 0) {
                // Mərhələ 1: Göy izolyasiya şiltəsi sərilir
                const silte = document.createElement('a-plane');
                silte.setAttribute('position', '0 0.01 0');
                silte.setAttribute('rotation', '-90 0 0');
                silte.setAttribute('width', '3');
                silte.setAttribute('height', '3');
                silte.setAttribute('color', '#00a2ff');
                silte.setAttribute('opacity', '0.7');
                arWorld.appendChild(silte);
            } 
            else if (laminateStep === 1) {
                // Mərhələ 2: İlk taxta yerləşir
                createLaminateBoard("-0.8 0.02 -0.8", "1.5", "#a05a2c");
            } 
            else if (laminateStep === 2) {
                // Mərhələ 3: İkinci taxta bucaq altında animasiya ilə gəlir
                createLaminateBoard("-0.8 0.02 -0.8", "1.5", "#a05a2c");
                
                const board2 = createLaminateBoard("0.8 0.2 -0.8", "1.5", "#d2b48c");
                board2.setAttribute('rotation', '-15 0 0'); // Animasiya effekti üçün maili duruş
            } 
            else if (laminateStep === 3) {
                // Mərhələ 4: Bütün sahə laminatla örtülür
                for(let i = 0; i < 3; i++) {
                    createLaminateBoard(`-0.8 0.02 ${-0.8 + (i * 0.55)}`, "3.2", "#8b5a2b");
                }
            }
        }

        // Köməkçi Funksiyalar
        function createLaminateBoard(pos, width, color) {
            const board = document.createElement('a-box');
            board.setAttribute('position', pos);
            board.setAttribute('width', width);
            board.setAttribute('height', '0.02');
            board.setAttribute('depth', '0.5');
            board.setAttribute('color', color);
            board.setAttribute('roughness', '0.3');
            arWorld.appendChild(board);
            return board;
        }

        function clearWorld() {
            while (arWorld.childNodes.length > 2) {
                arWorld.removeChild(arWorld.lastChild);
            }
        }
    </script>
</body>
</html>
